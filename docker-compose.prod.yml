services:
  # ============================================================
  # Microsoft SQL Server (MSSQL 2022) Database Service
  # ============================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: caritas_mssql_prod
    restart: always
    env_file:
      - ./database/.env
    environment:
      MSSQL_TCP_PORT: "${MSSQL_TCP_PORT:-1433}"
    volumes:
      - ./database/data:/var/opt/mssql/data
      - ./database/scripts:/database/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost,$MSSQL_TCP_PORT -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - caritas_prod_network

  # ============================================================
  # Backend API Service (Production compiled runner)
  # Targets the 'production' stage in Dockerfile
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: caritas_backend_prod
    restart: always
    env_file:
      - ./apps/backend/.env
    environment:
      PORT: "${PORT:-3000}"
      DB_PORT: "${MSSQL_TCP_PORT:-1433}"
    ports:
      - "3000:${PORT:-3000}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - caritas_prod_network

networks:
  caritas_prod_network:
    driver: bridge
